<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        // Store current location for SPA
        var l = window.location;
        sessionStorage.setItem('redirect', l.pathname + l.search + l.hash);
        // Force redirect to home
        setTimeout(function () {
            window.location = '/';
        }, 0);
    </script>
</head>

<body></body>

</html>
