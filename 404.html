<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title></title>
    <script>
        // Redirect SPA 404s to the root index.html
        var segment = /(\/[^.]+)+$/g;
        if (segment.test(location.pathname)) {
            location.replace('/index.html?p=' + location.pathname.slice(1));
        }
    </script>
</head>

<body>
</body>

</html>
