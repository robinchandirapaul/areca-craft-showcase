<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        // GitHub Pages SPA routing fix
        var l = window.location;
        var path = l.pathname.slice(1);

        // Only redirect if not on root
        if (path) {
            sessionStorage.redirect = '/' + path + (l.search || '') + (l.hash || '');
            // Small delay to ensure sessionStorage is set before reload
            setTimeout(function () {
                window.location.href = '/';
            }, 50);
        }
    </script>
</head>

<body>
</body>

</html>
